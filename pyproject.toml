[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardinality-eval"
version = "0.1.0"
description = "Does structured-extraction recall degrade with the number of items to emit?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raunak Sood" }]

[tool.pytest.ini_options]
pythonpath = ["project"]
testpaths = ["project/tests"]
